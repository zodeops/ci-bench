name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: zode-2x4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: zode-ci test -- python -m pytest
